name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          ABAD8E: ${{ secrets.ABAD8E }}
          BF5700: ${{ secrets.BF5700 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('ABAD8E', '')
          tag_b = os.environ.get('BF5700', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 5f143a99c9830df5217c -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 96f7d5eb15ba851c9abe2f3a6915e9 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
